<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas Card -->
  <rect width="780" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- RAM Section -->
  <rect x="30" y="22" width="290" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="45" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">MEMORIA RAM (KOTLIN)</text>
  <text x="45" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">PlantaBinaria(3, "Margarita", 0.6)</text>
  <text x="45" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">putInt(3) · put(nombre) · putDouble(0.6)</text>

  <!-- Arrow RAM to Buffer -->
  <path d="M 324 55 L 362 55" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="343" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563eb">flip()</text>

  <!-- Buffer Section -->
  <rect x="372" y="22" width="378" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="385" y="41" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">BYTEBUFFER (32 BYTES)</text>
  
  <rect x="385" y="48" width="55" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="412" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1e40af" font-weight="600">ID (4B)</text>

  <rect x="446" y="48" width="198" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="545" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1e40af" font-weight="600">Nombre (20B con espacios)</text>

  <rect x="650" y="48" width="88" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="694" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1e40af" font-weight="600">Precio (8B)</text>

  <!-- Mid Section: File Label & Downward Arrow -->
  <text x="30" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.3">DISCO: fichero 'plantas.bin'</text>

  <path d="M 610 88 L 610 134" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="622" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">canal.write(buffer)</text>

  <!-- DISK Records Tape -->
  <!-- Record 1 -->
  <rect x="30" y="140" width="220" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="140" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">Registro 1: "Rosa"</text>
  <text x="140" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">Bytes 0 – 31 (32B)</text>

  <!-- Record 2 -->
  <rect x="260" y="140" width="220" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="370" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">Registro 2: "Girasol"</text>
  <text x="370" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">Bytes 32 – 63 (32B)</text>

  <!-- Record 3 (Appended) -->
  <rect x="490" y="140" width="260" height="58" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="620" y="164" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857">[+] Registro 3: "Margarita"</text>
  <text x="620" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#059669">Bytes 64 – 95 (añadido al final)</text>

  <!-- Footer Tip Box -->
  <rect x="30" y="218" width="720" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="244" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#475569">
    <tspan font-weight="700" fill="#0f172a">Modo APPEND:</tspan> El puntero se sitúa al final del fichero y añade los 32 bytes sin reescribir los datos previos.
  </text>
</svg>
