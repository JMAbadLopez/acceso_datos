<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Canvas Card -->
  <rect width="800" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Formula Header Box -->
  <rect x="30" y="16" width="740" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="45" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#334155">
    <tspan font-weight="700" fill="#0f172a">Cálculo de posición in-situ:</tspan> 
    posicionPrecio = inicio (32B) + TAMANO_ID (4B) + TAMANO_NOMBRE (20B) = <tspan font-weight="700" fill="#d97706">56 bytes</tspan>
  </text>

  <!-- Row 2: File Label and Pointer Jump Arc with Text Above -->
  <text x="30" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.3">DISCO: fichero 'plantas.bin'</text>

  <!-- Text above the Arc (no intersection) -->
  <text x="390" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#d97706">
    canal.position(56) ➔ Salto directo al campo precio
  </text>
  <!-- Arc jumping from start of Record 2 to Price field -->
  <path d="M 210 90 C 300 74 480 74 538 126" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

  <!-- DISK Main Strip -->
  <!-- Record 1 (Left, untouched) -->
  <rect x="30" y="115" width="130" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="95" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">Registro 1 (Rosa)</text>
  <text x="95" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" fill="#94a3b8">32B (intacto)</text>

  <!-- Record 2 (Expanded container) -->
  <rect x="170" y="108" width="450" height="98" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="185" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#92400e" letter-spacing="0.3">REGISTRO 2: GIRASOL (BYTES 32 A 63)</text>

  <!-- Field ID -->
  <rect x="185" y="136" width="70" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569">ID: 2</text>
  <text x="220" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#94a3b8">4 bytes</text>
  <text x="220" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" fill="#cbd5e1">[32..35]</text>

  <!-- Field Nombre -->
  <rect x="263" y="136" width="195" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Nombre: "Girasol    "</text>
  <text x="360" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#94a3b8">20 bytes (intacto)</text>
  <text x="360" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" fill="#cbd5e1">[36..55]</text>

  <!-- Field Precio (Target overwrite) -->
  <rect x="466" y="132" width="144" height="66" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
  <text x="538" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#b45309">PRECIO (8B)</text>
  <text x="538" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#b45309">3.0€ ➔ 5.5€</text>
  <text x="538" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#d97706">Bytes 56..63</text>

  <!-- Record 3 (Right, untouched) -->
  <rect x="630" y="115" width="140" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">Registro 3 (Margarita)</text>
  <text x="700" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" fill="#94a3b8">32B (intacto)</text>

  <!-- Row 4: RAM Buffer & Upward Overwrite Arrow -->
  <rect x="30" y="232" width="350" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="258" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#475569">
    <tspan font-weight="700" fill="#0f172a">Sobrescritura in-situ:</tspan> Solo se alteran los 8 bytes del precio.
  </text>

  <!-- Buffer 8B -->
  <rect x="400" y="232" width="276" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="538" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#1d4ed8">
    ByteBuffer (8B): putDouble(5.5) + flip()
  </text>

  <!-- Arrow pointing from Buffer UP to Precio Field -->
  <path d="M 538 232 L 538 204" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="548" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#2563eb">
    canal.write(bufferPrecio)
  </text>

  <!-- Footer Tip Box -->
  <rect x="30" y="286" width="740" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="311" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#475569">
    <tspan font-weight="700" fill="#0f172a">Ventaja clave:</tspan> El archivo no se trunca ni se reescribe por completo; el puntero se posiciona y actualiza únicamente esos 8 bytes en disco.
  </text>
</svg>
