<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficheros de Acceso Aleatorio — Operaciones CRUD</title>
<style>
:root {
  --bg:       #2b2b2b;
  --surface:  #3c3f41;
  --surface2: #4a4e50;
  --border:   #555;
  --accent:   #da7756;
  --text:     #a9b7c6;
  --bright:   #e0e0e0;
  --green:    #6a8759;
  --blue:     #6897bb;
  --yellow:   #ffc66d;
  --purple:   #c792ea;
  --red:      #cc6666;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono','Consolas',monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 12px;}
h1{color:var(--accent);text-align:center;font-size:1.25rem;margin-bottom:4px;}
.subtitle{text-align:center;font-size:0.78rem;opacity:.65;margin-bottom:18px;}

/* ── Tabs ── */
.op-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.op-tab{padding:7px 18px;border:2px solid var(--surface2);border-radius:6px;cursor:pointer;font-family:inherit;font-size:0.8rem;font-weight:bold;background:var(--surface);color:var(--text);transition:all .2s;letter-spacing:.5px;}
.op-tab:hover{border-color:var(--accent);color:var(--bright);}
.op-tab.active{border-color:var(--accent);background:var(--accent);color:#fff;}

/* ── Layout ── */
.card{max-width:980px;margin:0 auto 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.op-header{padding:10px 16px;font-size:0.8rem;font-weight:bold;letter-spacing:.5px;border-bottom:1px solid var(--border);}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
@media(max-width:680px){.content-grid{grid-template-columns:1fr;}}
.visual-col{padding:14px;border-right:1px solid var(--border);}
.info-col{padding:14px;}
@media(max-width:680px){.visual-col{border-right:none;border-bottom:1px solid var(--border);}}

/* ── Panel labels ── */
.col-label{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;font-weight:bold;}
.step-title{font-size:.95rem;color:var(--bright);font-weight:bold;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.step-num{color:var(--accent);}
.step-desc{font-size:.8rem;line-height:1.65;color:var(--bright);margin-bottom:12px;}
.step-desc code{background:#1e1f22;padding:1px 5px;border-radius:3px;color:var(--yellow);font-size:.78rem;}
.step-desc strong{color:var(--accent);}

/* ── Code block ── */
.code-box{background:#1e1f22;border:1px solid var(--border);border-radius:5px;padding:10px 12px;font-size:.73rem;line-height:1.65;overflow-x:auto;white-space:pre;}
.kw{color:var(--purple);}
.fn{color:var(--blue);}
.st{color:var(--green);}
.cm{color:#698878;font-style:italic;}
.ty{color:var(--accent);}
.hl{color:var(--yellow);font-weight:bold;}
.nu{color:#6897bb;}

/* ── File visualization ── */
.file-wrap{margin-bottom:10px;}
.file-label{font-size:.68rem;opacity:.7;margin-bottom:5px;}
.file-header-row{display:flex;font-size:.63rem;opacity:.55;margin-bottom:3px;padding:0 2px;}
.fh-id{width:42px;text-align:center;}
.fh-name{flex:1;padding-left:6px;}
.fh-price{width:68px;text-align:right;}
.file-record{display:flex;border-radius:4px;overflow:hidden;border:1px solid var(--border);margin-bottom:4px;font-size:.74rem;transition:all .35s;}
.fr-id{background:#2e3b4e;padding:5px 4px;text-align:center;width:42px;flex-shrink:0;border-right:1px solid var(--border);color:var(--blue);}
.fr-name{background:#2e3d2e;padding:5px 8px;flex:1;border-right:1px solid var(--border);color:var(--green);}
.fr-price{background:#3d2e2e;padding:5px 6px;text-align:right;width:68px;flex-shrink:0;color:var(--orange,#da7756);}
.file-record.found{border-color:var(--yellow);box-shadow:0 0 7px rgba(255,198,109,.35);}
.file-record.found .fr-id,.file-record.found .fr-name,.file-record.found .fr-price{background:rgba(255,198,109,.1);}
.file-record.new-pending{border:2px dashed var(--green);opacity:.55;}
.file-record.new-writing{border:2px solid var(--green);box-shadow:0 0 8px rgba(106,135,89,.4);}
.file-record.new-done{border:1px solid var(--green);}
.file-record.skip-this{opacity:.3;border-color:var(--red);position:relative;}
.file-record.copied{border-color:var(--green);box-shadow:0 0 5px rgba(106,135,89,.3);}
.file-record.dimmed{opacity:.45;}
.cursor-row{font-size:.68rem;color:var(--accent);margin-top:4px;display:flex;align-items:center;gap:5px;}
.cursor-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.skip-badge{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:var(--red);color:#fff;font-size:.6rem;padding:1px 5px;border-radius:3px;}

/* ── Temp file ── */
.tmp-wrap{margin-top:8px;border:1px dashed var(--purple);border-radius:5px;padding:8px;}
.tmp-label{font-size:.68rem;color:var(--purple);margin-bottom:5px;}
.tmp-empty{font-size:.72rem;opacity:.45;font-style:italic;}

/* ── ByteBuffer ── */
.buf-wrap{margin-bottom:10px;}
.buf-label{font-size:.68rem;opacity:.7;margin-bottom:5px;}
.buf-bar{display:flex;height:46px;border-radius:4px;overflow:hidden;border:1px solid var(--border);transition:all .3s;}
.buf-id{background:#2e3b4e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-size:.68rem;transition:background .3s;width:15%;border-right:1px solid var(--border);}
.buf-name{background:#2e3d2e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-size:.68rem;transition:background .3s;flex:1;border-right:1px solid var(--border);}
.buf-price{background:#3d2e2e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-size:.68rem;transition:background .3s;width:24%;}
.buf-field-lbl{font-size:.58rem;opacity:.65;}
.buf-id.filled{background:var(--blue);color:#fff;}
.buf-name.filled{background:var(--green);color:#fff;}
.buf-price.filled{background:var(--accent);color:#fff;}
.buf-id.empty,.buf-name.empty,.buf-price.empty{background:var(--surface2);color:var(--text);opacity:.5;}
.buf-id.reading{background:var(--blue);color:#fff;animation:rpulse .7s infinite;}
.buf-name.reading{background:var(--green);color:#fff;animation:rpulse .7s infinite;}
.buf-price.reading{background:var(--accent);color:#fff;animation:rpulse .7s infinite;}
@keyframes rpulse{0%,100%{opacity:1;}50%{opacity:.6;}}

/* Buffer markers */
.buf-markers{position:relative;height:18px;margin-top:3px;}
.bm{position:absolute;font-size:.62rem;transform:translateX(-50%);white-space:nowrap;transition:left .35s;}
.bm-pos{color:var(--yellow);}
.bm-lim{color:var(--red);}

/* ── Channel ── */
.channel-wrap{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0;font-size:.75rem;}
.ch-icon{font-size:1.4rem;color:var(--accent);transition:all .3s;}
.ch-flow{display:flex;gap:3px;align-items:center;}
.ch-arrow{color:var(--accent);animation:flowR 1s infinite;}
.ch-arrow.rev{animation:flowL 1s infinite;}
@keyframes flowR{0%{opacity:0;transform:translateX(-6px);}50%{opacity:1;}100%{opacity:0;transform:translateX(6px);}}
@keyframes flowL{0%{opacity:0;transform:translateX(6px);}50%{opacity:1;}100%{opacity:0;transform:translateX(-6px);}}
.ch-label{font-size:.68rem;opacity:.7;text-align:center;}

/* ── Nav bar ── */
.nav-bar{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
.nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--bright);padding:5px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.8rem;transition:all .2s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.dots{display:flex;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);cursor:pointer;transition:background .2s;}
.dot.active{background:var(--accent);}
.dot.done{background:var(--green);}
.step-lbl{font-size:.78rem;color:var(--text);min-width:55px;text-align:center;}

/* ── Fade transition ── */
.fade-in{animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<h1>Ficheros Binarios de Acceso Aleatorio</h1>
<p class="subtitle">Guía visual paso a paso &nbsp;·&nbsp; <code style="background:#1e1f22;padding:1px 5px;border-radius:3px;color:#ffc66d">FileChannel</code> + <code style="background:#1e1f22;padding:1px 5px;border-radius:3px;color:#ffc66d">ByteBuffer</code> &nbsp;·&nbsp; Java NIO</p>

<div class="op-tabs" id="op-tabs">
  <button class="op-tab active" data-op="ESCRIBIR">✏️&nbsp;ESCRIBIR</button>
  <button class="op-tab"        data-op="LEER">📖&nbsp;LEER</button>
  <button class="op-tab"        data-op="MODIFICAR">🎯&nbsp;MODIFICAR</button>
  <button class="op-tab"        data-op="ELIMINAR">🗑️&nbsp;ELIMINAR</button>
</div>

<div class="card">
  <div class="op-header" id="op-header"></div>
  <div class="content-grid">
    <div class="visual-col fade-in" id="visual-col"></div>
    <div class="info-col fade-in"   id="info-col"></div>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn" id="btn-prev">← Anterior</button>
  <div class="dots" id="dots"></div>
  <span class="step-lbl" id="step-lbl"></span>
  <button class="nav-btn" id="btn-next">Siguiente →</button>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const BASE_RECORDS = [
  { id: 1, name: 'Rosa',      price: '1.5€' },
  { id: 2, name: 'Girasol',   price: '3.0€' },
  { id: 3, name: 'Margarita', price: '0.6€' },
];

const OPS = {

  // ════════════════════════════════════════════
  ESCRIBIR: {
    color: '#6a8759',
    headerText: '✏️  ESCRIBIR — Añadir un nuevo registro al final del fichero',
    steps: [
      {
        title: 'Abrir el canal en modo <code>APPEND</code>',
        desc: 'Se abre un <code>FileChannel</code> con las opciones <strong>WRITE, CREATE y APPEND</strong>. El canal posiciona automáticamente su puntero al <strong>final del fichero</strong> (byte 96 = 3 registros × 32 bytes), listo para añadir después de los datos existentes.',
        code: `<span class="kw">FileChannel</span>.<span class="fn">open</span>(
    archivoPath,
    StandardOpenOption.WRITE,
    StandardOpenOption.CREATE,
    <span class="hl">StandardOpenOption.APPEND</span>   <span class="cm">// puntero al final</span>
).<span class="fn">use</span> { canal -> ... }`,
        file: {
          records: [
            { ...BASE_RECORDS[0], status: 'normal' },
            { ...BASE_RECORDS[1], status: 'normal' },
            { ...BASE_RECORDS[2], status: 'normal' },
            { id: 4, name: 'Tulipán', price: '2.0€', status: 'new-pending' },
          ],
          cursor: 'Puntero del canal → byte 96 (fin del fichero)'
        },
        buf: { id:'empty', name:'empty', price:'empty', pos:0, lim:32, posLabel:'pos=0', limLabel:'lim=32' },
        channel: { active:false, direction:null, label:'FileChannel abierto · modo APPEND' },
        tmp: null
      },
      {
        title: '<code>ByteBuffer.allocate(32)</code> — reservar espacio en RAM',
        desc: 'Se reserva en la memoria RAM un <code>ByteBuffer</code> de exactamente <strong>32 bytes</strong>: el tamaño fijo de un registro. El cursor (<strong>position</strong>) apunta al inicio (byte 0) y el límite (<strong>limit</strong>) es 32. El buffer aún está vacío.',
        code: `<span class="kw">val</span> buffer = ByteBuffer.<span class="fn">allocate</span>(<span class="hl">TAMANO_REGISTRO</span>)
<span class="cm">// TAMANO_REGISTRO = 4 + 20 + 8 = 32 bytes
// position = 0, limit = 32</span>`,
        file: {
          records: [
            { ...BASE_RECORDS[0], status: 'normal' },
            { ...BASE_RECORDS[1], status: 'normal' },
            { ...BASE_RECORDS[2], status: 'normal' },
            { id: 4, name: 'Tulipán', price: '2.0€', status: 'new-pending' },
          ],
          cursor: 'Puntero del canal → byte 96'
        },
        buf: { id:'empty', name:'empty', price:'empty', pos:0, lim:32, posLabel:'pos=0', limLabel:'lim=32' },
        channel: { active:false, direction:null, label:'Buffer vacío · 32 bytes reservados' },
        tmp: null
      },
      {
        title: 'Rellenar el buffer campo a campo con <code>put…()</code>',
        desc: 'Los tres métodos <code>put</code> escriben los datos en el buffer; el cursor avanza con cada campo: <code>putInt</code> escribe 4 bytes (pos→4) · <code>put</code> escribe los 20 bytes del nombre con relleno de espacios (pos→24) · <code>putDouble</code> escribe 8 bytes del precio (pos→32).',
        code: `buffer.<span class="fn">putInt</span>(nuevaPlanta.idPlanta)        <span class="cm">// 4B → pos=4</span>
<span class="kw">val</span> nombreBytes = nuevaPlanta.nombreComun
    .<span class="fn">padEnd</span>(TAMANO_NOMBRE, <span class="st">' '</span>)         <span class="cm">// rellena a 20</span>
    .<span class="fn">toByteArray</span>(Charsets.ISO_8859_1)
buffer.<span class="fn">put</span>(nombreBytes, <span class="nu">0</span>, TAMANO_NOMBRE) <span class="cm">// 20B → pos=24</span>
buffer.<span class="fn">putDouble</span>(nuevaPlanta.precio)    <span class="cm">// 8B → pos=32</span>`,
        file: {
          records: [
            { ...BASE_RECORDS[0], status: 'normal' },
            { ...BASE_RECORDS[1], status: 'normal' },
            { ...BASE_RECORDS[2], status: 'normal' },
            { id: 4, name: 'Tulipán', price: '2.0€', status: 'new-pending' },
          ],
          cursor: 'Puntero del canal → byte 96'
        },
        buf: { id:'filled', name:'filled', price:'filled', pos:32, lim:32,
               idVal:'4', nameVal:'Tulipán…', priceVal:'2.0€', posLabel:'pos=32', limLabel:'lim=32' },
        channel: { active:false, direction:null, label:'Buffer lleno · position = limit = 32' },
        tmp: null
      },
      {
        title: '<code>buffer.flip()</code> — preparar para volcar al disco',
        desc: '<code>flip()</code> es fundamental: <strong>baja el limit</strong> a la posición actual (32) y <strong>devuelve el cursor a 0</strong>. Ahora el buffer sabe que tiene 32 bytes válidos para enviar al canal. Sin esta llamada el canal no escribiría nada, porque <code>hasRemaining()</code> sería false.',
        code: `<span class="cm">// Antes del flip:</span>
<span class="cm">//   position=32 · limit=32</span>
buffer.<span class="hl">flip</span>()
<span class="cm">// Después del flip:</span>
<span class="cm">//   position=0  · limit=32  ← listo para leer</span>`,
        file: {
          records: [
            { ...BASE_RECORDS[0], status: 'normal' },
            { ...BASE_RECORDS[1], status: 'normal' },
            { ...BASE_RECORDS[2], status: 'normal' },
            { id: 4, name: 'Tulipán', price: '2.0€', status: 'new-pending' },
          ],
          cursor: 'Puntero del canal → byte 96'
        },
        buf: { id:'filled', name:'filled', price:'filled', pos:0, lim:32,
               idVal:'4', nameVal:'Tulipán…', priceVal:'2.0€', posLabel:'pos=0 ↩', limLabel:'lim=32', flipped:true },
        channel: { active:false, direction:null, label:'Buffer listo · flip() aplicado' },
        tmp: null
      },
      {
        title: '<code>canal.write(buffer)</code> — transferir 32 bytes al disco',
        desc: 'El canal transfiere los <strong>32 bytes</strong> desde el buffer hasta el final del fichero. El bucle <code>while (buffer.hasRemaining())</code> garantiza la escritura completa aunque el sistema operativo no los envíe todos de una vez.',
        code: `<span class="kw">while</span> (buffer.<span class="fn">hasRemaining</span>()) {
    canal.<span class="hl">write</span>(buffer)   <span class="cm">// → 32 bytes al disco</span>
}
<span class="cm">// Registro añadido en bytes 96–127</span>`,
        file: {
          records: [
            { ...BASE_RECORDS[0], status: 'normal' },
            { ...BASE_RECORDS[1], status: 'normal' },
            { ...BASE_RECORDS[2], status: 'normal' },
            { id: 4, name: 'Tulipán', price: '2.0€', status: 'new-writing' },
          ],
          cursor: 'Escribiendo bytes 96–127…'
        },
        buf: { id:'filled', name:'filled', price:'filled', pos:0, lim:32,
               idVal:'4', nameVal:'Tulipán…', priceVal:'2.0€', posLabel:'pos=0', limLabel:'lim=32' },
        channel: { active:true, direction:'to-file', label:'FileChannel → transfiriendo datos' },
        tmp: null
      },
      {
        title: '¡Registro añadido con éxito!',
        desc: 'El nuevo registro (ID=4, <strong>Tulipán</strong>, 2.0€) ocupa exactamente los bytes <strong>96–127</strong> del fichero. La estructura de tamaño fijo (32B/registro) se mantiene, lo que permite calcular la posición de cualquier registro con una simple multiplicación: <em>posición = índice × 32</em>.',
        code: `println(<span class="st">"Planta 'Tulipán' añadida."</span>)
<span class="cm">// Byte offset del registro 4:
//   (4 - 1) × 32 = 96 bytes desde el inicio</span>`,
        file: {
          records: [
            { ...BASE_RECORDS[0], status: 'normal' },
            { ...BASE_RECORDS[1], status: 'normal' },
            { ...BASE_RECORDS[2], status: 'normal' },
            { id: 4, name: 'Tulipán', price: '2.0€', status: 'new-done' },
          ],
          cursor: 'Fichero: 4 registros · 128 bytes'
        },
        buf: { id:'empty', name:'empty', price:'empty', pos:32, lim:32, posLabel:'pos=32', limLabel:'lim=32' },
        channel: { active:false, direction:null, label:'Escritura completada ✔' },
        tmp: null
      },
    ]
  },

  // ════════════════════════════════════════════
  LEER: {
    color: '#6897bb',
    headerText: '📖  LEER — Lectura secuencial de todos los registros',
    steps: [
      {
        title: 'Abrir el canal en modo <code>READ</code>',
        desc: 'Se abre un <code>FileChannel</code> solo con la opción <strong>READ</strong>. El puntero del canal empieza en el <strong>byte 0</strong> (inicio del fichero). El canal recorrerá los registros uno a uno de forma secuencial.',
        code: `<span class="kw">FileChannel</span>.<span class="fn">open</span>(archivoPath,
    <span class="hl">StandardOpenOption.READ</span>
).<span class="fn">use</span> { canal ->
    <span class="cm">// puntero en byte 0 → inicio del fichero</span>
}`,
        file: {
          records: BASE_RECORDS.map(r=>({...r,status:'normal'})),
          cursor: 'Puntero del canal → byte 0 (inicio)'
        },
        buf: { id:'empty', name:'empty', price:'empty', pos:0, lim:32, posLabel:'pos=0', limLabel:'lim=32' },
        channel: { active:false, direction:null, label:'FileChannel abierto · modo READ' },
        tmp: null
      },
      {
        title: '<code>ByteBuffer.allocate(32)</code> — buffer vacío en RAM',
        desc: 'Se crea un <code>ByteBuffer</code> de <strong>32 bytes</strong> en la RAM. Se reutilizará para cada registro: primero se llena desde el canal, se extraen los campos, y se reinicia con <code>buffer.clear()</code> para el siguiente.',
        code: `<span class="kw">val</span> buffer = ByteBuffer.<span class="fn">allocate</span>(<span class="hl">TAMANO_REGISTRO</span>)
<span class="cm">// position=0 · limit=32 · buffer vacío</span>`,
        file: {
          records: BASE_RECORDS.map(r=>({...r,status:'normal'})),
          cursor: 'Puntero del canal → byte 0'
        },
        buf: { id:'empty', name:'empty', price:'empty', pos:0, lim:32, posLabel:'pos=0', limLabel:'lim=32' },
        channel: { active:false, direction:null, label:'Buffer vacío · listo para recibir datos' },
        tmp: null
      },
      {
        title: '<code>canal.read(buffer)</code> + <code>buffer.flip()</code>',
        desc: '<code>canal.read(buffer)</code> copia exactamente <strong>32 bytes</strong> del fichero al buffer (un registro completo) y avanza el puntero del canal. Después, <code>buffer.flip()</code> posiciona el cursor en 0 con limit=32 para poder leer los campos.',
        code: `<span class="kw">while</span> (canal.<span class="fn">read</span>(buffer) > <span class="nu">0</span>) {   <span class="cm">// 32B del disco</span>
    buffer.<span class="hl">flip</span>()
    <span class="cm">// position=0 · limit=32 · listo para leer</span>
    ...
}`,
        file: {
          records: [
            { ...BASE_RECORDS[0], status: 'found' },
            { ...BASE_RECORDS[1], status: 'normal' },
            { ...BASE_RECORDS[2], status: 'normal' },
          ],
          cursor: 'Puntero del canal → byte 32 (tras leer reg. #1)'
        },
        buf: { id:'filled', name:'filled', price:'filled', pos:0, lim:32,
               idVal:'1', nameVal:'Rosa…', priceVal:'1.5€', posLabel:'pos=0', limLabel:'lim=32' },
        channel: { active:true, direction:'to-ram', label:'Disco → RAM · 32 bytes leídos' },
        tmp: null
      },
      {
        title: 'Extraer campos con <code>get…()</code>',
        desc: 'Se extraen los campos en orden con <code>getInt()</code>, <code>get(array)</code> y <code>getDouble()</code>. El cursor del buffer avanza con cada lectura: 0→4 (ID) · 4→24 (Nombre) · 24→32 (Precio). Finalmente se construye el objeto <code>PlantaBinaria</code>.',
        code: `<span class="kw">val</span> id     = buffer.<span class="hl">getInt</span>()          <span class="cm">// 4B → pos=4</span>
<span class="kw">val</span> bytes  = ByteArray(<span class="nu">20</span>)
buffer.<span class="hl">get</span>(bytes)                   <span class="cm">// 20B → pos=24</span>
<span class="kw">val</span> nombre = String(bytes,

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentOp   = 'ESCRIBIR';
let currentStep = 0;

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() {
  const op   = OPS[currentOp];
  const step = op.steps[currentStep];
  const total = op.steps.length;

  // header
  const header = document.getElementById('op-header');
  header.textContent = op.headerText;
  header.style.color = op.color;

  // visual column
  document.getElementById('visual-col').innerHTML = renderVisual(step);

  // info column
  document.getElementById('info-col').innerHTML = renderInfo(step, currentStep + 1, total);

  // dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentStep ? ' active' : (i < currentStep ? ' done' : ''));
    d.onclick = () => { currentStep = i; render(); };
    dotsEl.appendChild(d);
  }

  document.getElementById('step-lbl').textContent = `${currentStep + 1} / ${total}`;
  document.getElementById('btn-prev').disabled = currentStep === 0;
  document.getElementById('btn-next').disabled = currentStep === total - 1;
}

function renderVisual(step) {
  return `
    <div class="col-label">📂 Fichero en Disco</div>
    ${renderFile(step.file)}
    ${step.channel ? renderChannel(step.channel) : ''}
    <div class="col-label" style="margin-top:10px">💾 ByteBuffer en RAM</div>
    ${renderBuffer(step.buf)}
    ${step.tmp !== null ? renderTmp(step.tmp) : ''}
  `;
}

function renderFile(fileState) {
  const { records, cursor } = fileState;
  let html = `
    <div class="file-wrap">
      <div class="file-header-row">
        <span class="fh-id">ID (4B)</span>
        <span class="fh-name">Nombre (20B)</span>
        <span class="fh-price">Precio (8B)</span>
      </div>`;
  for (const r of records) {
    const statusClass = r.status !== 'normal' ? r.status : '';
    html += `<div class="file-record ${statusClass}">
      <div class="fr-id">${r.id}</div>
      <div class="fr-name">${r.name}</div>
      <div class="fr-price">${r.price}</div>
      ${r.status === 'skip-this' ? '<div class="skip-badge">SKIP</div>' : ''}
    </div>`;
  }
  if (cursor) {
    html += `<div class="cursor-row"><div class="cursor-dot"></div>${cursor}</div>`;
  }
  html += '</div>';
  return html;
}

function renderBuffer(buf) {
  const idCls    = buf.id    === 'filled' ? 'filled' : (buf.id    === 'reading' ? 'reading' : 'empty');
  const nameCls  = buf.name  === 'filled' ? 'filled' : (buf.name  === 'reading' ? 'reading' : 'empty');
  const priceCls = buf.price === 'filled' ? 'filled' : (buf.price === 'reading' ? 'reading' : 'empty');

  const idTxt    = buf.idVal    || (buf.id    !== 'empty' ? 'ID'     : '—');
  const nameTxt  = buf.nameVal  || (buf.name  !== 'empty' ? 'Nombre' : '—');
  const priceTxt = buf.priceVal || (buf.price !== 'empty' ? 'Precio' : '—');

  const posPercent = Math.round((buf.pos / 32) * 100);
  const limPercent = Math.round((buf.lim / 32) * 100);

  return `
    <div class="buf-wrap">
      <div class="buf-bar">
        <div class="buf-id ${idCls}">
          <span>${idTxt}</span>
          <span class="buf-field-lbl">4B</span>
        </div>
        <div class="buf-name ${nameCls}">
          <span>${nameTxt}</span>
          <span class="buf-field-lbl">20B</span>
        </div>
        <div class="buf-price ${priceCls}">
          <span>${priceTxt}</span>
          <span class="buf-field-lbl">8B</span>
        </div>
      </div>
      <div class="buf-markers" style="position:relative;height:18px;margin-top:3px;">
        <span class="bm bm-pos" style="left:${posPercent}%">▲ ${buf.posLabel || 'pos=0'}</span>
        <span class="bm bm-lim" style="left:${limPercent}%">▲ ${buf.limLabel || 'lim=32'}</span>
      </div>
    </div>`;
}

function renderChannel(ch) {
  if (!ch.active) {
    return `<div class="channel-wrap">
      <span class="ch-icon">⇌</span>
      <span class="ch-label">${ch.label || 'FileChannel'}</span>
    </div>`;
  }
  const arrows = ch.direction === 'to-file'
    ? `<span class="ch-arrow">→</span><span class="ch-arrow">→</span><span class="ch-arrow">→</span>`
    : `<span class="ch-arrow rev">←</span><span class="ch-arrow rev">←</span><span class="ch-arrow rev">←</span>`;
  return `<div class="channel-wrap">
    <span class="ch-icon" style="color:var(--accent)">⇌</span>
    <div class="ch-flow">${arrows}</div>
    <span class="ch-label" style="color:var(--accent)">${ch.label}</span>
  </div>`;
}

function renderTmp(tmp) {
  let html = `<div class="tmp-wrap"><div class="tmp-label">📄 plantas.bin.tmp</div>`;
  if (tmp.replaced) {
    html += `<div class="tmp-empty">✔ .tmp eliminado · fichero reemplazado</div>`;
  } else if (tmp.empty || tmp.records.length === 0) {
    html += `<div class="tmp-empty">(vacío)</div>`;
  } else {
    for (const r of tmp.records) {
      html += `<div class="file-record copied" style="margin-bottom:3px">
        <div class="fr-id">${r.id}</div>
        <div class="fr-name">${r.name}</div>
        <div class="fr-price">${r.price}</div>
      </div>`;
    }
  }
  html += '</div>';
  return html;
}

function renderInfo(step, stepNum, total) {
  return `
    <div class="col-label">Paso ${stepNum} de ${total}</div>
    <div class="step-title">${step.title}</div>
    <div class="step-desc">${step.desc}</div>
    <div class="col-label" style="margin-bottom:6px">Código Kotlin</div>
    <div class="code-box">${step.code}</div>
  `;
}

// ─────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────
document.getElementById('btn-prev').onclick = () => {
  if (currentStep > 0) { currentStep--; render(); }
};
document.getElementById('btn-next').onclick = () => {
  if (currentStep < OPS[currentOp].steps.length - 1) { currentStep++; render(); }
};

document.querySelectorAll('.op-tab').forEach(btn => {
  btn.onclick = () => {
    currentOp = btn.dataset.op;
    currentStep = 0;
    document.querySelectorAll('.op-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (currentStep < OPS[currentOp].steps.length - 1) { currentStep++; render(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (currentStep > 0) { currentStep--; render(); }
  }
});

// Initial render
render();
</script>
</body>
</html>
