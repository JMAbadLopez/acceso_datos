<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Client - Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Test de API: Usuarios</h1>
            <div id="auth-status" class="auth-status">
                <span id="user-display">No identificado</span>
                <button id="btn-logout" class="hidden">Cerrar Sesión</button>
            </div>
        </header>

        <!-- Authentication Section -->
        <section id="login-section" class="card fade-in">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </section>

        <!-- Main Dashboard (Hidden by default) -->
        <main id="dashboard" class="hidden fade-in">
            
            <div class="grid-layout">
                <!-- Create User -->
                <section class="card">
                    <h2>Crear Usuario</h2>
                    <form id="create-user-form">
                        <div class="form-group">
                            <label for="new-nombre">Nombre</label>
                            <input type="text" id="new-nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="new-email">Email</label>
                            <input type="email" id="new-email" required>
                        </div>
                        <div class="form-group">
                            <label for="new-password">Contraseña</label>
                            <input type="password" id="new-password" required>
                        </div>
                        <button type="submit" class="btn-success">Crear Usuario</button>
                    </form>
                </section>

                <!-- Operations -->
                <section class="card">
                    <h2>Operaciones por ID</h2>
                    <div class="form-group">
                        <label for="op-id">ID de Usuario</label>
                        <input type="number" id="op-id" placeholder="ID">
                    </div>
                    <div class="button-group">
                        <button id="btn-get-id" class="btn-secondary">Buscar</button>
                        <button id="btn-delete-id" class="btn-danger">Eliminar</button>
                    </div>
                    
                    <hr>
                    
                    <h3>Actualizar Usuario</h3>
                    <form id="update-user-form">
                        <div class="form-group">
                            <input type="text" id="update-nombre" placeholder="Nuevo Nombre">
                        </div>
                        <div class="form-group">
                            <input type="email" id="update-email" placeholder="Nuevo Email">
                        </div>
                         <div class="form-group">
                            <input type="password" id="update-password" placeholder="Nueva Contraseña">
                        </div>
                        <button type="submit" class="btn-warning">Actualizar</button>
                    </form>
                </section>
            </div>

            <!-- Users List -->
            <section class="card full-width">
                <div class="header-row">
                    <h2>Lista de Usuarios</h2>
                    <button id="btn-refresh" class="btn-icon" title="Recargar">↻</button>
                </div>
                <div id="users-list" class="users-grid">
                    <!-- User items will be injected here -->
                    <p class="placeholder-text">Cargando usuarios...</p>
                </div>
            </section>

        </main>

        <!-- Logs / Responses -->
        <section id="logs-section" class="card full-width">
            <h2>Log de Respuestas</h2>
            <div id="logs-container" class="logs-box">
                <div class="log-entry info">Esperando acciones...</div>
            </div>
            <button id="btn-clear-logs" class="btn-small">Limpiar Logs</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
